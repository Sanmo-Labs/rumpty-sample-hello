<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>You're live on RumptyCloud</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      :root {
        --ink: #f5efe4;
        --ink-2: #d7cfc0;
        --muted: #9a9183;
        --accent: #59c2ff;
        --lime: #67c192;
        --sun: #f4c56d;
        --card: rgba(12, 15, 20, 0.72);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        min-height: 100vh;
        color: var(--ink);
        font-family: "Space Grotesk", system-ui, sans-serif;
        background: #071018;
        overflow: hidden;
      }
      .sky {
        position: fixed;
        inset: 0;
        background:
          radial-gradient(ellipse 55% 42% at 78% 18%, rgba(244, 197, 109, 0.38), transparent 58%),
          radial-gradient(ellipse 40% 30% at 18% 28%, rgba(89, 194, 255, 0.16), transparent 62%),
          linear-gradient(180deg, #16324a 0%, #1c3d3a 38%, #1a3328 62%, #0f1c16 100%);
      }
      .scene {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .sun {
        fill: var(--sun);
        filter: drop-shadow(0 0 28px rgba(244, 197, 109, 0.55));
      }
      .hill-back { fill: #1b4636; }
      .hill-mid { fill: #24543f; }
      .hill-front { fill: #163528; }
      .grass { fill: #1f4a34; }
      .tree-canopy { fill: #2f7a4f; }
      .tree-trunk { fill: #3a2a1c; }
      .panel { fill: #1b3d5c; stroke: #59c2ff; stroke-width: 1.2; }
      .panel-rail { fill: #2a241c; }
      .tower { fill: #e8e0d2; }
      .blade { fill: #f5efe4; transform-origin: 1080px 268px; animation: spin 9s linear infinite; }
      .cloud { fill: rgba(245, 239, 228, 0.16); }
      .drift-a { animation: drift 38s linear infinite; }
      .drift-b { animation: drift 52s linear infinite reverse; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes drift {
        from { transform: translateX(0); }
        to { transform: translateX(80px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .blade, .drift-a, .drift-b { animation: none; }
      }
      .shell {
        position: relative;
        z-index: 2;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 20px 18vh;
      }
      .card {
        width: min(100%, 420px);
        padding: 28px 28px 26px;
        border: 1px solid rgba(245, 239, 228, 0.14);
        border-radius: 18px;
        background: var(--card);
        backdrop-filter: blur(10px);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
      }
      .kicker {
        margin: 0 0 10px;
        font-family: ui-monospace, Menlo, monospace;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }
      h1 {
        margin: 0 0 12px;
        font-family: "Bricolage Grotesque", "Space Grotesk", sans-serif;
        font-size: clamp(30px, 6vw, 40px);
        line-height: 1.05;
        letter-spacing: -0.04em;
      }
      h1 span { color: var(--accent); }
      p { margin: 0; line-height: 1.55; color: var(--ink-2); }
    </style>
  </head>
  <body>
    <div class="sky" aria-hidden="true"></div>
    <svg class="scene" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <circle class="sun" cx="1120" cy="150" r="52" />
      <ellipse class="cloud drift-a" cx="280" cy="140" rx="90" ry="22" />
      <ellipse class="cloud drift-b" cx="430" cy="168" rx="60" ry="16" />
      <ellipse class="cloud drift-a" cx="980" cy="120" rx="70" ry="18" />
      <path class="hill-back" d="M0 520 C180 430 340 470 520 410 C720 340 900 430 1100 380 C1260 340 1360 400 1440 370 V900 H0 Z" />
      <path class="hill-mid" d="M0 610 C220 530 410 580 620 520 C860 450 1040 560 1240 510 C1340 485 1400 520 1440 500 V900 H0 Z" />
      <g class="tree">
        <rect class="tree-trunk" x="168" y="548" width="10" height="46" rx="2" />
        <circle class="tree-canopy" cx="173" cy="536" r="26" />
        <circle class="tree-canopy" cx="154" cy="548" r="16" />
        <circle class="tree-canopy" cx="192" cy="550" r="15" />
      </g>
      <g class="tree">
        <rect class="tree-trunk" x="1260" y="500" width="11" height="52" rx="2" />
        <circle class="tree-canopy" cx="1266" cy="488" r="28" />
        <circle class="tree-canopy" cx="1246" cy="502" r="16" />
      </g>
      <g class="solar" transform="translate(210 560)">
        <rect class="panel-rail" x="0" y="58" width="430" height="8" rx="2" />
        <g transform="skewX(-18)">
          <rect class="panel" x="12" y="8" width="72" height="46" rx="3" />
          <rect class="panel" x="94" y="8" width="72" height="46" rx="3" />
          <rect class="panel" x="176" y="8" width="72" height="46" rx="3" />
          <rect class="panel" x="258" y="8" width="72" height="46" rx="3" />
          <rect class="panel" x="340" y="8" width="72" height="46" rx="3" />
        </g>
      </g>
      <g class="solar" transform="translate(250 620)">
        <rect class="panel-rail" x="0" y="58" width="470" height="8" rx="2" />
        <g transform="skewX(-18)">
          <rect class="panel" x="16" y="10" width="78" height="46" rx="3" />
          <rect class="panel" x="104" y="10" width="78" height="46" rx="3" />
          <rect class="panel" x="192" y="10" width="78" height="46" rx="3" />
          <rect class="panel" x="280" y="10" width="78" height="46" rx="3" />
          <rect class="panel" x="368" y="10" width="78" height="46" rx="3" />
        </g>
      </g>
      <g class="windmill">
        <rect class="tower" x="1073" y="268" width="14" height="310" rx="6" />
        <circle class="tower" cx="1080" cy="268" r="14" />
        <g class="blade">
          <rect x="1074" y="148" width="12" height="120" rx="6" />
          <rect x="1074" y="268" width="12" height="120" rx="6" transform="rotate(120 1080 268)" />
          <rect x="1074" y="268" width="12" height="120" rx="6" transform="rotate(240 1080 268)" />
        </g>
      </g>
      <path class="hill-front" d="M0 740 C260 680 480 760 760 700 C1040 640 1240 730 1440 690 V900 H0 Z" />
      <path class="grass" d="M0 820 C200 790 400 850 700 800 C1000 750 1220 830 1440 790 V900 H0 Z" />
    </svg>
    <main class="shell">
      <div class="card">
        <p class="kicker">sample app</p>
        <h1>You're live on <span>RumptyCloud</span></h1>
        <p>This page was deployed from the official sample. Replace it with your own repo whenever you're ready.</p>
      </div>
    </main>
  </body>
</html>
