    <style>
      :root {
        --ink: #14202b;
        --ink-2: #3f4d5a;
        --ink-3: #6a7784;
        --accent: #1a8ad4;
        --leaf: #2f8a45;
        --font-display: "Bricolage Grotesque", "Space Grotesk", system-ui, sans-serif;
        --font-body: "Space Grotesk", system-ui, sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        min-height: 100vh;
        color: var(--ink);
        font-family: var(--font-body);
        background: linear-gradient(180deg, #3b98df 0%, #66b8ee 34%, #a9dbf6 66%, #e4f4fb 100%);
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }

      .haze {
        position: fixed;
        inset: 0;
        background:
          radial-gradient(circle at 82% 14%, rgba(255, 238, 176, 0.6) 0%, rgba(255, 238, 176, 0) 42%),
          radial-gradient(ellipse 120% 40% at 50% 70%, rgba(255, 255, 255, 0.45), transparent 70%);
        pointer-events: none;
      }

      .sun {
        position: fixed;
        top: 9vh;
        right: 15vw;
        width: clamp(72px, 12vmin, 132px);
        aspect-ratio: 1;
      }
      .sun-rays {
        position: absolute;
        inset: -130%;
        border-radius: 50%;
        background: repeating-conic-gradient(rgba(255, 244, 190, 0.32) 0deg 4deg, transparent 4deg 14deg);
        -webkit-mask: radial-gradient(circle, #000 16%, transparent 62%);
        mask: radial-gradient(circle, #000 16%, transparent 62%);
        animation: spin 120s linear infinite;
      }
      .sun-core {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: radial-gradient(circle at 40% 38%, #fffbe6 0%, #ffe887 42%, #ffc94a 100%);
        box-shadow:
          0 0 36px 10px rgba(255, 212, 92, 0.6),
          0 0 140px 60px rgba(255, 228, 150, 0.35);
        animation: glow 6s ease-in-out infinite;
      }

      .clouds { position: fixed; inset: 0; pointer-events: none; }
      .cloud {
        position: absolute;
        left: 0;
        top: var(--top);
        width: var(--w);
        opacity: var(--o, 1);
        filter: drop-shadow(0 10px 14px rgba(36, 96, 146, 0.12));
        animation: drift var(--dur) linear infinite;
        animation-delay: var(--delay);
        will-change: transform;
      }
      .cloud svg { display: block; width: 100%; height: auto; }

      .birds {
        position: fixed;
        top: 22vh;
        left: 0;
        width: 64px;
        animation: fly 70s linear infinite;
        animation-delay: -24s;
      }
      .birds svg { display: block; width: 100%; height: auto; overflow: visible; }

      .land {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 54vh;
        pointer-events: none;
      }
      .land svg { display: block; width: 100%; height: 100%; overflow: visible; }

      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes glow {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.035); }
      }
      @keyframes drift {
        from { transform: translateX(-45vw); }
        to { transform: translateX(110vw); }
      }
      @keyframes fly {
        from { transform: translate(-10vw, 0); }
        to { transform: translate(110vw, -8vh); }
      }
      @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(47, 138, 69, 0.45); }
        70% { box-shadow: 0 0 0 8px rgba(47, 138, 69, 0); }
        100% { box-shadow: 0 0 0 0 rgba(47, 138, 69, 0); }
      }
      @keyframes rise {
        from { opacity: 0; transform: translateY(14px); }
        to { opacity: 1; transform: none; }
      }

      .shell {
        position: relative;
        z-index: 2;
        min-height: 100vh;
        display: grid;
        justify-items: center;
        align-items: start;
        padding: clamp(24px, 9vh, 110px) 20px 40vh;
      }
      .card {
        width: min(100%, 500px);
        padding: 26px 30px 20px;
        border: 1px solid rgba(255, 255, 255, 0.75);
        border-radius: 22px;
        background: rgba(255, 252, 245, 0.72);
        -webkit-backdrop-filter: blur(16px) saturate(1.3);
        backdrop-filter: blur(16px) saturate(1.3);
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.9) inset,
          0 30px 70px -20px rgba(20, 70, 110, 0.35);
        animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }
      .card-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 22px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: var(--font-display);
        font-size: 17px;
        font-weight: 800;
        letter-spacing: -0.025em;
        color: var(--ink);
        text-decoration: none;
      }
      .brand svg { width: 32px; height: 32px; border-radius: 8px; display: block; }
      .brand-accent { color: var(--accent); }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px 6px 10px;
        border-radius: 999px;
        background: rgba(47, 138, 69, 0.11);
        color: var(--leaf);
        font-family: var(--font-mono);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--leaf);
        animation: pulse 2s ease-out infinite;
      }
      h1 {
        margin: 0;
        font-family: var(--font-display);
        font-size: clamp(32px, min(6.4vw, 6.6vh), 54px);
        line-height: 1.02;
        font-weight: 700;
        letter-spacing: -0.03em;
        text-wrap: balance;
      }
      .lede {
        margin: 14px 0 0;
        font-size: 16px;
        line-height: 1.55;
        color: var(--ink-2);
        text-wrap: pretty;
      }
      .foot {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 20px 0 0;
        padding-top: 14px;
        border-top: 1px solid rgba(20, 32, 43, 0.08);
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--ink-3);
      }
      .foot svg { flex-shrink: 0; }

      @media (max-width: 520px) {
        .card { padding: 22px 20px 18px; border-radius: 18px; }
        .card-top { margin-bottom: 18px; }
        .lede { font-size: 15px; }
      }
      .gloom {
        position: fixed;
        inset: 0;
        background: linear-gradient(180deg, #56677a 0%, #7d8d9b 50%, #aab4bc 100%);
        opacity: 0;
        pointer-events: none;
      }
      .storm-clouds { opacity: 0; }
      .storm-clouds .cloud { filter: brightness(0.62) saturate(0.4) drop-shadow(0 14px 18px rgba(30, 40, 52, 0.25)); }
      .rainbow {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 18vh;
        filter: blur(1.5px);
        opacity: 0;
        pointer-events: none;
      }
      .rainbow svg { display: block; width: 100%; height: auto; }
      .rain {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        opacity: 0;
      }
      .gloom, .sun, .haze, .clouds, .storm-clouds, .rainbow, .rain, .land, .birds {
        transition: opacity 6s ease, filter 6s ease;
      }

      body[data-weather="overcast"] .gloom { opacity: 0.5; }
      body[data-weather="overcast"] .sun { opacity: 0.45; }
      body[data-weather="overcast"] .storm-clouds { opacity: 0.7; }
      body[data-weather="overcast"] .clouds { filter: brightness(0.9) saturate(0.75); }
      body[data-weather="overcast"] .land { filter: brightness(0.9) saturate(0.85); }

      body[data-weather="rain"] .gloom { opacity: 0.85; }
      body[data-weather="rain"] .sun,
      body[data-weather="rain"] .haze,
      body[data-weather="rain"] .birds { opacity: 0; }
      body[data-weather="rain"] .storm-clouds { opacity: 1; }
      body[data-weather="rain"] .clouds { filter: brightness(0.72) saturate(0.5); }
      body[data-weather="rain"] .land { filter: brightness(0.74) saturate(0.78); }
      body[data-weather="rain"] .rain { opacity: 1; }

      body[data-weather="clearing"] .gloom { opacity: 0.18; }
      body[data-weather="clearing"] .sun { opacity: 0.9; }
      body[data-weather="clearing"] .storm-clouds { opacity: 0; }
      body[data-weather="clearing"] .rainbow { opacity: 0.75; }
      body[data-weather="clearing"] .land { filter: brightness(1.02) saturate(1.08); }

      .foot-rain { display: none; }
      body[data-weather="overcast"] .foot-sun,
      body[data-weather="rain"] .foot-sun { display: none; }
      body[data-weather="overcast"] .foot-rain,
      body[data-weather="rain"] .foot-rain { display: inline-flex; }
      .foot span { align-items: center; gap: 10px; }
      .foot-sun { display: inline-flex; }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; }
      }
    </style>
  </head>

    <script>
      (function () {
        var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (reduced) {
          document.querySelectorAll("svg").forEach(function (svg) {
            if (svg.pauseAnimations) svg.pauseAnimations();
          });
          return;
        }

        var body = document.body;
        var cycle = [
          ["sun", 28000],
          ["overcast", 8000],
          ["rain", 22000],
          ["clearing", 14000]
        ];
        var step = 0;
        function advance() {
          var stage = cycle[step];
          body.setAttribute("data-weather", stage[0]);
          if (stage[0] === "rain") startRain();
          step = (step + 1) % cycle.length;
          setTimeout(advance, stage[1]);
        }

        var canvas = document.querySelector(".rain");
        var ctx = canvas.getContext("2d");
        var drops = [];
        var width = 0;
        var height = 0;
        var running = false;
        var last = 0;

        function resize() {
          var dpr = Math.min(window.devicePixelRatio || 1, 2);
          width = window.innerWidth;
          height = window.innerHeight;
          canvas.width = width * dpr;
          canvas.height = height * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        function makeDrop(anywhere) {
          var depth = Math.random();
          return {
            x: Math.random() * (width + 200) - 100,
            y: anywhere ? Math.random() * height : -20 - Math.random() * height * 0.3,
            len: 10 + depth * 16,
            speed: 700 + depth * 700,
            alpha: 0.25 + depth * 0.4
          };
        }

        function startRain() {
          if (running) return;
          resize();
          var count = Math.round(Math.min(420, (width * height) / 2600));
          drops = [];
          for (var i = 0; i < count; i++) drops.push(makeDrop(true));
          running = true;
          last = performance.now();
          requestAnimationFrame(frame);
        }

        function frame(now) {
          var dt = Math.min((now - last) / 1000, 0.05);
          last = now;
          var raining = body.getAttribute("data-weather") === "rain";
          var visible = parseFloat(getComputedStyle(canvas).opacity) > 0.01;
          if (!raining && !visible) {
            running = false;
            ctx.clearRect(0, 0, width, height);
            return;
          }
          ctx.clearRect(0, 0, width, height);
          ctx.lineCap = "round";
          ctx.lineWidth = 1.3;
          for (var i = 0; i < drops.length; i++) {
            var d = drops[i];
            d.y += d.speed * dt;
            d.x -= d.speed * 0.18 * dt;
            if (d.y > height + 20) drops[i] = makeDrop(false);
            ctx.strokeStyle = "rgba(226, 238, 250," + d.alpha + ")";
            ctx.beginPath();
            ctx.moveTo(d.x, d.y);
            ctx.lineTo(d.x + d.len * 0.18, d.y - d.len);
            ctx.stroke();
          }
          requestAnimationFrame(frame);
        }

        window.addEventListener("resize", function () { if (running) resize(); });
        setTimeout(advance, 0);
      })();
    </script>
