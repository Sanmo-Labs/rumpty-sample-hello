<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>You're live on RumptyCloud</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --ink: #f5efe4;
        --ink-2: #c9c1b3;
        --ink-3: #7d7568;
        --accent: #59C2FF;
        --card: rgba(12, 15, 20, 0.74);
        --font-display: "Bricolage Grotesque", "Space Grotesk", system-ui, sans-serif;
        --font-body: "Space Grotesk", system-ui, sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        min-height: 100vh;
        color: var(--ink);
        font-family: var(--font-body);
        background: #10283a;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      .sun {
        position: fixed;
        top: 7vh;
        right: 14vw;
        width: 9vmin;
        height: 9vmin;
        border-radius: 50%;
        background: #f6c56a;
        box-shadow: 0 0 6vmin 2vmin rgba(246, 197, 106, 0.35);
      }
      .sky {
        position: fixed;
        inset: 0;
        background:
          radial-gradient(ellipse 70% 45% at 50% 100%, #1f5a3a 0%, #184832 38%, transparent 58%),
          linear-gradient(180deg, #16344c 0%, #1d4a44 52%, #163628 100%);
      }
      .cloud {
        position: fixed;
        background: rgba(245, 239, 228, 0.2);
        border-radius: 999px;
        filter: blur(0.5px);
      }
      .c1 { width: 18vmin; height: 4.4vmin; top: 10vh; left: 8vw; animation: drift 38s linear infinite; }
      .c2 { width: 11vmin; height: 3vmin; top: 16vh; left: 22vw; animation: drift 52s linear infinite reverse; }
      .c3 { width: 14vmin; height: 3.4vmin; top: 8vh; left: 58vw; animation: drift 46s linear infinite; }
      .hill {
        position: fixed;
        left: -8vw;
        right: -8vw;
        border-radius: 50% 50% 0 0;
      }
      .h1 { height: 34vh; bottom: 18vh; background: #1a4536; }
      .h2 { height: 26vh; bottom: 10vh; background: #216246; }
      .h3 { height: 18vh; bottom: 0; background: #17432e; }
      .tree {
        position: fixed;
        bottom: 16vh;
        width: 7vmin;
        height: 16vmin;
      }
      .tree::before {
        content: "";
        position: absolute;
        left: 42%;
        bottom: 0;
        width: 16%;
        height: 42%;
        background: #3a2a1c;
        border-radius: 2px;
      }
      .tree::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: 28%;
        width: 7.2vmin;
        height: 7.2vmin;
        transform: translateX(-50%);
        background: #2f7a4f;
        border-radius: 50%;
        box-shadow: -2.2vmin 1.6vmin 0 -0.6vmin #2a6d46, 2.1vmin 1.8vmin 0 -0.8vmin #348353;
      }
      .t1 { left: 4vw; }
      .t2 { left: 12vw; transform: scale(0.78); transform-origin: bottom center; }
      .solar {
        position: fixed;
        left: 5vw;
        bottom: 24vh;
        width: min(36vw, 420px);
        height: 22vh;
        z-index: 1;
      }
      .solar svg { width: 100%; height: 100%; overflow: visible; }
      .windmill {
        position: fixed;
        right: 11vw;
        bottom: 16vh;
        width: min(20vw, 210px);
        height: min(56vh, 460px);
        z-index: 1;
      }
      .windmill svg { width: 100%; height: 100%; overflow: visible; }
      .blade {
        transform-box: fill-box;
        transform-origin: center;
        animation: spin 8s linear infinite;
        fill: #f7f1e6;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes drift {
        from { transform: translateX(0); }
        to { transform: translateX(8vw); }
      }
      @media (prefers-reduced-motion: reduce) {
        .blade, .c1, .c2, .c3 { animation: none; }
      }
      .shell {
        position: relative;
        z-index: 2;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px 20px 26vh;
      }
      .card {
        width: min(100%, 520px);
        padding: 32px;
        border: 1px solid rgba(245, 239, 228, 0.14);
        border-radius: 18px;
        background: var(--card);
        backdrop-filter: blur(10px);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
      }
      .kicker {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 0 0 16px;
        font-family: var(--font-mono);
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink-3);
      }
      .kicker::before {
        content: "";
        width: 24px;
        height: 1px;
        background: var(--accent);
      }
      h1 {
        margin: 0;
        font-family: var(--font-display);
        font-size: clamp(40px, 8vw, 64px);
        line-height: 1;
        font-weight: 700;
        letter-spacing: -0.025em;
        text-wrap: balance;
      }
      h1 .cloud { color: var(--accent); }
      .lede {
        margin: 18px 0 0;
        font-size: 17px;
        line-height: 1.55;
        color: var(--ink-2);
        text-wrap: pretty;
      }
    </style>
  </head>
  <body>
    <div class="sky" aria-hidden="true"></div>
    <div class="sun" aria-hidden="true"></div>
    <div class="cloud c1" aria-hidden="true"></div>
    <div class="cloud c2" aria-hidden="true"></div>
    <div class="cloud c3" aria-hidden="true"></div>
    <div class="hill h1" aria-hidden="true"></div>
    <div class="hill h2" aria-hidden="true"></div>
    <div class="hill h3" aria-hidden="true"></div>
    <div class="tree t1" aria-hidden="true"></div>
    <div class="tree t2" aria-hidden="true"></div>
    <div class="solar" aria-hidden="true">
      <svg viewBox="0 0 520 150" preserveAspectRatio="xMidYMax meet">
        <rect x="18" y="126" width="470" height="12" rx="3" fill="#2c261c" />
        <g transform="skewX(-22) translate(48 22)">
          <g>
            <rect width="86" height="72" rx="5" fill="#163552" stroke="#7ad0ff" stroke-width="2.5" />
            <rect x="8" y="8" width="70" height="22" rx="2" fill="rgba(89,194,255,0.28)" />
          </g>
          <g transform="translate(98 0)">
            <rect width="86" height="72" rx="5" fill="#163552" stroke="#7ad0ff" stroke-width="2.5" />
            <rect x="8" y="8" width="70" height="22" rx="2" fill="rgba(89,194,255,0.28)" />
          </g>
          <g transform="translate(196 0)">
            <rect width="86" height="72" rx="5" fill="#163552" stroke="#7ad0ff" stroke-width="2.5" />
            <rect x="8" y="8" width="70" height="22" rx="2" fill="rgba(89,194,255,0.28)" />
          </g>
          <g transform="translate(294 0)">
            <rect width="86" height="72" rx="5" fill="#163552" stroke="#7ad0ff" stroke-width="2.5" />
            <rect x="8" y="8" width="70" height="22" rx="2" fill="rgba(89,194,255,0.28)" />
          </g>
        </g>
      </svg>
    </div>
    <div class="windmill" aria-hidden="true">
      <svg viewBox="0 0 200 420" preserveAspectRatio="xMidYMax meet">
        <polygon points="86,88 114,88 132,410 68,410" fill="#efe7d8" />
        <g class="blade" transform="translate(100 86)">
          <rect x="-9" y="-128" width="18" height="128" rx="9" />
          <rect x="-9" y="-128" width="18" height="128" rx="9" transform="rotate(120)" />
          <rect x="-9" y="-128" width="18" height="128" rx="9" transform="rotate(240)" />
        </g>
        <circle cx="100" cy="86" r="16" fill="#f5efe4" />
      </svg>
    </div>
    <main class="shell">
      <div class="card">
        <p class="kicker">sample app</p>
        <h1>You're live on Rumpty<span class="cloud">Cloud</span>.</h1>
        <p class="lede">This page was deployed from the official sample. Replace it with your own repo whenever you're ready.</p>
      </div>
    </main>
  </body>
</html>
